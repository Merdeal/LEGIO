name: LEGIO - Download 3D Assets

on:
  workflow_dispatch:

jobs:
  download:
    runs-on: ubuntu-latest

    steps:
      - name: Download Kenney 3D assets
        run: |
          set -e

          echo "=== DOWNLOAD LEGIO 3D ASSETS ==="

          git clone \
            --depth 1 \
            --filter=blob:none \
            --sparse \
            https://github.com/shorepine/kenney.git \
            /tmp/kenney

          cd /tmp/kenney

          git sparse-checkout set \
            3d/city-roads \
            3d/city-suburban \
            3d/city-commercial \
            3d/city-industrial \
            3d/nature \
            3d/building

          cd "$GITHUB_WORKSPACE"

          mkdir -p assets/3d/kenney

          cp -R /tmp/kenney/3d/city-roads assets/3d/kenney/
          cp -R /tmp/kenney/3d/city-suburban assets/3d/kenney/
          cp -R /tmp/kenney/3d/city-commercial assets/3d/kenney/
          cp -R /tmp/kenney/3d/city-industrial assets/3d/kenney/
          cp -R /tmp/kenney/3d/nature assets/3d/kenney/
          cp -R /tmp/kenney/3d/building assets/3d/kenney/

          echo ""
          echo "=== MODELLI TROVATI ==="

          find assets/3d/kenney \
            -type f \
            \( -iname "*.glb" -o -iname "*.gltf" \) \
            | sort

          COUNT=$(find assets/3d/kenney \
            -type f \
            \( -iname "*.glb" -o -iname "*.gltf" \) \
            | wc -l)

          echo ""
          echo "================================"
          echo "TOTALE MODELLI GLB/GLTF: $COUNT"
          echo "================================"

          if [ "$COUNT" -lt 100 ]; then
            echo "ERRORE: troppo pochi modelli."
            exit 1
          fi

          echo ""
          echo "=== DIMENSIONE ==="
          du -sh assets/3d/kenney

      - name: Create LEGIO asset pack
        run: |
          set -e

          cd assets
          zip -r -q ../LEGIO_3D_ASSET_PACK.zip 3d
          cd ..

          ls -lh LEGIO_3D_ASSET_PACK.zip

      - name: Upload LEGIO asset pack
        uses: actions/upload-artifact@v4
        with:
          name: LEGIO_3D_ASSET_PACK
          path: LEGIO_3D_ASSET_PACK.zip
          retention-days: 7
