name: LEGIO - Download FULL 3D Library

on:
  workflow_dispatch:

jobs:
  download:
    runs-on: ubuntu-latest

    steps:
      - name: Download complete Kenney 3D library
        run: |
          set -e

          echo "=== LEGIO FULL 3D LIBRARY ==="

          git clone \
            --depth 1 \
            --filter=blob:none \
            --sparse \
            https://github.com/shorepine/kenney.git \
            /tmp/kenney

          cd /tmp/kenney

          echo "Scarico TUTTA la cartella 3D..."
          git sparse-checkout set 3d

          cd "$GITHUB_WORKSPACE"

          mkdir -p assets/3d/kenney

          cp -R /tmp/kenney/3d/. assets/3d/kenney/

          echo ""
          echo "=== VERIFICA MODELLI ==="

          COUNT=$(find assets/3d/kenney \
            -type f \
            \( -iname "*.glb" -o -iname "*.gltf" \) \
            | wc -l)

          echo "TOTALE GLB/GLTF: $COUNT"

          if [ "$COUNT" -lt 1000 ]; then
            echo "ERRORE: libreria incompleta."
            exit 1
          fi

          echo ""
          echo "=== CATEGORIE ==="
          find assets/3d/kenney \
            -mindepth 1 -maxdepth 1 -type d \
            | sort

          echo ""
          echo "=== DIMENSIONE ==="
          du -sh assets/3d/kenney

      - name: Create FULL LEGIO asset pack
        run: |
          set -e

          cd assets
          zip -r -q ../LEGIO_FULL_3D_ASSET_LIBRARY.zip 3d
          cd ..

          echo "=== PACCHETTO CREATO ==="
          ls -lh LEGIO_FULL_3D_ASSET_LIBRARY.zip

      - name: Upload FULL asset library
        uses: actions/upload-artifact@v4
        with:
          name: LEGIO_FULL_3D_ASSET_LIBRARY
          path: LEGIO_FULL_3D_ASSET_LIBRARY.zip
          retention-days: 7
