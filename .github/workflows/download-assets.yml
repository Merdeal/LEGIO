name: LEGIO - Download 3D Assets

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  download-assets:
    runs-on: ubuntu-latest

    steps:
      - name: Download asset packs
        shell: bash
        run: |
          set -e

          mkdir -p LEGIO_ASSETS

          download_kenney() {
            NAME="$1"
            PAGE="$2"
            DEST="$3"

            echo "======================================"
            echo "DOWNLOAD: $NAME"
            echo "PAGE: $PAGE"
            echo "======================================"

            HTML=$(curl -L --fail --retry 3 "$PAGE")

            URL=$(printf '%s' "$HTML" \
              | grep -oE 'href="[^"]+\.zip[^"]*"' \
              | head -n 1 \
              | sed -E 's/^href="//; s/"$//')

            if [ -z "$URL" ]; then
              echo "ERRORE: ZIP non trovato per $NAME"
              exit 1
            fi

            case "$URL" in
              http://*|https://*)
                ;;
              /*)
                URL="https://kenney.nl$URL"
                ;;
              *)
                URL="https://kenney.nl/$URL"
                ;;
            esac

            echo "ZIP trovato:"
            echo "$URL"

            mkdir -p "$DEST"

            curl -L --fail --retry 3 \
              "$URL" \
              -o "/tmp/$NAME.zip"

            unzip -q -o "/tmp/$NAME.zip" -d "$DEST"

            echo "File 3D trovati:"
            find "$DEST" -type f \
              \( -iname "*.glb" -o -iname "*.gltf" \) \
              | head -50
          }

          download_kenney \
            "roads" \
            "https://kenney.nl/assets/city-kit-roads" \
            "LEGIO_ASSETS/roads"

          download_kenney \
            "suburban" \
            "https://kenney.nl/assets/city-kit-suburban" \
            "LEGIO_ASSETS/buildings"

          download_kenney \
            "industrial" \
            "https://kenney.nl/assets/city-kit-industrial" \
            "LEGIO_ASSETS/industrial"

          download_kenney \
            "commercial" \
            "https://kenney.nl/assets/city-kit-commercial" \
            "LEGIO_ASSETS/commercial"

          download_kenney \
            "cars" \
            "https://kenney.nl/assets/car-kit" \
            "LEGIO_ASSETS/vehicles"

      - name: Verify real 3D assets
        shell: bash
        run: |
          echo ""
          echo "======================================"
          echo "VERIFICA ASSET"
          echo "======================================"

          GLB=$(find LEGIO_ASSETS -type f -iname "*.glb" | wc -l)
          GLTF=$(find LEGIO_ASSETS -type f -iname "*.gltf" | wc -l)

          echo "GLB:  $GLB"
          echo "GLTF: $GLTF"

          if [ "$GLB" -eq 0 ] && [ "$GLTF" -eq 0 ]; then
            echo "ERRORE: nessun modello GLB/GLTF scaricato."
            exit 1
          fi

          echo ""
          echo "MODELLI TROVATI:"
          find LEGIO_ASSETS -type f \
            \( -iname "*.glb" -o -iname "*.gltf" \) \
            | sort

      - name: Create LEGIO asset pack
        shell: bash
        run: |
          zip -qr LEGIO_ASSET_PACK.zip LEGIO_ASSETS

          echo ""
          echo "======================================"
          echo "PACCHETTO CREATO"
          echo "======================================"

          ls -lh LEGIO_ASSET_PACK.zip

      - name: Upload asset pack
        uses: actions/upload-artifact@v4
        with:
          name: LEGIO_ASSET_PACK
          path: LEGIO_ASSET_PACK.zip
          retention-days: 7
